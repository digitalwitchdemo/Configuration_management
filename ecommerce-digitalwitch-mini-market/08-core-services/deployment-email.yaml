apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: email
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: email
  template:
    metadata:
      labels:
        app.kubernetes.io/name: email
        app.kubernetes.io/part-of: digitalwitch-market
    spec:
      containers:
      - name: email
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/email:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 100M
          requests:
            memory: 100M
        ports:
        - containerPort: 6060
          protocol: TCP
        env:
        - name: APP_ENV
          value: production
        - name: EMAIL_PORT
          value: '6060'
        - name: OTEL_SERVICE_NAME
          value: email
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=medium
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          tcpSocket:
            port: 6060
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: email
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: email
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: email
  ports:
  - name: http
    port: 6060
    targetPort: 6060
