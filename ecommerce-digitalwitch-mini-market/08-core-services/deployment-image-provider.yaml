apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-provider
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: image-provider
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-provider
        app.kubernetes.io/part-of: digitalwitch-market
    spec:
      containers:
      - name: image-provider
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/image-provider:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 120M
          requests:
            memory: 120M
        ports:
        - containerPort: 8081
          protocol: TCP
        env:
        - name: IMAGE_PROVIDER_PORT
          value: '8081'
        - name: OTEL_SERVICE_NAME
          value: image-provider
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=low
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          httpGet:
            path: /status
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: image-provider
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: image-provider
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: image-provider
  ports:
  - name: http
    port: 8081
    targetPort: 8081
