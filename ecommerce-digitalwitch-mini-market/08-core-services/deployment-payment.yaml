apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment
        app.kubernetes.io/part-of: digitalwitch-market
    spec:
      containers:
      - name: payment
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/payment:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 140M
          requests:
            memory: 140M
        ports:
        - containerPort: 50051
          protocol: TCP
        env:
        - name: PAYMENT_PORT
          value: '50051'
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: grpc
        - name: OTEL_SERVICE_NAME
          value: payment
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=critical
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
          && until nc -z -w2 flagd 8013; do echo "waiting for flagd:8013"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: payment
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: payment
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
