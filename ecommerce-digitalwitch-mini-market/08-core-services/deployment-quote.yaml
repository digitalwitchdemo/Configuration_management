apiVersion: apps/v1
kind: Deployment
metadata:
  name: quote
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: quote
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: quote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quote
        app.kubernetes.io/part-of: digitalwitch-market
    spec:
      containers:
      - name: quote
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/quote:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 40M
          requests:
            memory: 40M
        ports:
        - containerPort: 8090
          protocol: TCP
        env:
        - name: OTEL_PHP_AUTOLOAD_ENABLED
          value: 'true'
        - name: QUOTE_PORT
          value: '8090'
        - name: OTEL_PHP_INTERNAL_METRICS_ENABLED
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: quote
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=low
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          tcpSocket:
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: quote
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: quote
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: quote
  ports:
  - name: http
    port: 8090
    targetPort: 8090
