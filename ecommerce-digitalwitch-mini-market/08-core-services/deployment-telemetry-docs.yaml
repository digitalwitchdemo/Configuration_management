apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-docs
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: telemetry-docs
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-docs
        app.kubernetes.io/part-of: digitalwitch-market
    spec:
      containers:
      - name: telemetry-docs
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/telemetry-docs:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 100M
          requests:
            memory: 100M
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: TELEMETRY_DOCS_PORT
          value: '8000'
        - name: OTEL_SERVICE_NAME
          value: telemetry-docs
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=low
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-docs
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: telemetry-docs
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: telemetry-docs
  ports:
  - name: http
    port: 8000
    targetPort: 8000
