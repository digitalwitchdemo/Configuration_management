apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/part-of: digitalwitch-market
    spec:
      containers:
      - name: cart
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/cart:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 160M
          requests:
            memory: 160M
        ports:
        - containerPort: 7070
          protocol: TCP
        env:
        - name: CART_PORT
          value: '7070'
        - name: ASPNETCORE_URLS
          value: http://*:7070
        - name: OPAMP_SERVER_ENDPOINT
          value: wss://$(OPAMP_SERVER_HOST):4320/v1/opamp
        - name: OPAMP_SERVER_TLS_INSECURE_SKIP_VERIFY
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: cart
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=high
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          tcpSocket:
            port: 7070
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 valkey-cart 6379; do echo "waiting for valkey-cart:6379"; sleep 2; done && until
          nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done && until
          nc -z -w2 flagd 8013; do echo "waiting for flagd:8013"; sleep 2; done && until nc -z -w2 opamp-server
          4320; do echo "waiting for opamp-server:4320"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: cart
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: cart
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cart
  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
