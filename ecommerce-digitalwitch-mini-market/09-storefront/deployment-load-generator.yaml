apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-generator
        app.kubernetes.io/part-of: digitalwitch-market
    spec:
      containers:
      - name: load-generator
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/load-generator:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 1500M
          requests:
            memory: 1500M
        ports:
        - containerPort: 8089
          protocol: TCP
        env:
        - name: LOCUST_USERS
          value: '5'
        - name: LOCUST_HEADLESS
          value: 'false'
        - name: LOCUST_AUTOSTART
          value: 'true'
        - name: LOCUST_BROWSER_TRAFFIC_ENABLED
          value: 'true'
        - name: LOCUST_HTTP_USER_WEIGHT
          value: '9'
        - name: LOCUST_BROWSER_USER_WEIGHT
          value: '1'
        - name: LOCUST_WEB_HOST
          value: 0.0.0.0
        - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
          value: 'true'
        - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
          value: python
        - name: OTEL_SERVICE_NAME
          value: load-generator
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=low
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          tcpSocket:
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 frontend 8080; do echo "waiting for frontend:8080"; sleep 2; done && until nc
          -z -w2 flagd 8013; do echo "waiting for flagd:8013"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: load-generator
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: load-generator
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: load-generator
  ports:
  - name: http
    port: 8089
    targetPort: 8089
