apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-proxy
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: frontend-proxy
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-proxy
        app.kubernetes.io/part-of: digitalwitch-market
    spec:
      containers:
      - name: frontend-proxy
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/frontend-proxy:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 90M
          requests:
            memory: 90M
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 10000
          protocol: TCP
        env:
        - name: OTEL_SERVICE_NAME
          value: frontend-proxy
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=critical
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 frontend 8080; do echo "waiting for frontend:8080"; sleep 2; done && until nc
          -z -w2 load-generator 8089; do echo "waiting for load-generator:8089"; sleep 2; done && until
          nc -z -w2 flagd-ui 4000; do echo "waiting for flagd-ui:4000"; sleep 2; done && until nc -z -w2
          telemetry-docs 8000; do echo "waiting for telemetry-docs:8000"; sleep 2; done && until nc -z
          -w2 jaeger 16686; do echo "waiting for jaeger:16686"; sleep 2; done && until nc -z -w2 grafana
          3000; do echo "waiting for grafana:3000"; sleep 2; done && until nc -z -w2 opamp-server 4321;
          do echo "waiting for opamp-server:4321"; sleep 2; done && until nc -z -w2 chatbot 7860; do echo
          "waiting for chatbot:7860"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-proxy
  namespace: digitalwitch-market
  labels:
    app.kubernetes.io/name: frontend-proxy
    app.kubernetes.io/part-of: digitalwitch-market
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: frontend-proxy
  ports:
  - name: http
    port: 8080
    targetPort: 8080
