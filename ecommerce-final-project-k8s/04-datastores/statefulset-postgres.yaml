apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: astronomy-db
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: astronomy-db
    app.kubernetes.io/part-of: otel-demo
spec:
  serviceName: astronomy-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astronomy-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astronomy-db
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: astronomy-db
        image: postgres:18.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          protocol: TCP
        resources:
          limits:
            memory: 80M
          requests:
            memory: 80M
        command:
        - postgres
        - -c
        - shared_preload_libraries=pg_stat_statements
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        envFrom:
        - secretRef:
            name: postgres-secret
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init-sql
        configMap:
          name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: astronomy-db
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: astronomy-db
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: astronomy-db
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
