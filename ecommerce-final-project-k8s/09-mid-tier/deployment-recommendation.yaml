apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: recommendation
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recommendation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recommendation
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: recommendation
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/recommendation:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 500M
          requests:
            memory: 500M
        ports:
        - containerPort: 9001
          protocol: TCP
        env:
        - name: RECOMMENDATION_PORT
          value: '9001'
        - name: OTEL_PYTHON_LOG_CORRELATION
          value: 'true'
        - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
          value: 'true'
        - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
          value: python
        - name: OTEL_SERVICE_NAME
          value: recommendation
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=medium
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 product-catalog 3550; do echo "waiting for product-catalog:3550"; sleep 2; done
          && until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2;
          done && until nc -z -w2 flagd 8013; do echo "waiting for flagd:8013"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: recommendation
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: recommendation
  ports:
  - name: grpc
    port: 9001
    targetPort: 9001
