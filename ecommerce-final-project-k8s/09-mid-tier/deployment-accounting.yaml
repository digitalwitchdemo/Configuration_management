apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: accounting
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: accounting
  template:
    metadata:
      labels:
        app.kubernetes.io/name: accounting
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: accounting
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/accounting:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 160M
          requests:
            memory: 160M
        env:
        - name: DB_CONNECTION_STRING
          value: Host=$(POSTGRES_HOST);Username=astronomy_user;Password=$(POSTGRES_ASTRONOMY_PASSWORD);Database=astronomy_db
        - name: OTEL_DOTNET_AUTO_TRACES_ENTITYFRAMEWORKCORE_INSTRUMENTATION_ENABLED
          value: 'false'
        - name: OTEL_SERVICE_NAME
          value: accounting
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=low
        envFrom:
        - configMapRef:
            name: common-config
        - secretRef:
            name: postgres-secret
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
          && until nc -z -w2 kafka 9092; do echo "waiting for kafka:9092"; sleep 2; done && until nc -z
          -w2 astronomy-db 5432; do echo "waiting for astronomy-db:5432"; sleep 2; done
