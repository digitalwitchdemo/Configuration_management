apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: fraud-detection
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-detection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-detection
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: fraud-detection
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/fraud-detection:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 300M
          requests:
            memory: 300M
        env:
        - name: OTEL_INSTRUMENTATION_KAFKA_EXPERIMENTAL_SPAN_ATTRIBUTES
          value: 'true'
        - name: OTEL_INSTRUMENTATION_MESSAGING_EXPERIMENTAL_RECEIVE_TELEMETRY_ENABLED
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: fraud-detection
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=low
        envFrom:
        - configMapRef:
            name: common-config
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
          && until nc -z -w2 kafka 9092; do echo "waiting for kafka:9092"; sleep 2; done
