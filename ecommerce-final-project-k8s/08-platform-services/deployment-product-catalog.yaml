apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: product-catalog
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/product-catalog:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 20M
          requests:
            memory: 20M
        ports:
        - containerPort: 3550
          protocol: TCP
        env:
        - name: PRODUCT_CATALOG_PORT
          value: '3550'
        - name: GOMEMLIMIT
          value: 16MiB
        - name: OTEL_GO_X_OBSERVABILITY
          value: 'true'
        - name: OTEL_CONFIG_FILE
          value: /otel-config.yml
        - name: OTEL_SEMCONV_STABILITY_OPT_IN
          value: database
        - name: DB_CONNECTION_STRING
          value: postgres://astronomy_user:$(POSTGRES_ASTRONOMY_PASSWORD)@$(POSTGRES_HOST)/astronomy_db?sslmode=disable
        - name: OPAMP_SERVER_ENDPOINT
          value: wss://$(OPAMP_SERVER_HOST):4320/v1/opamp
        - name: OPAMP_SERVER_TLS_INSECURE_SKIP_VERIFY
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: product-catalog
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=high
        envFrom:
        - configMapRef:
            name: common-config
        - secretRef:
            name: postgres-secret
        volumeMounts:
        - name: otel-config
          mountPath: /otel-config.yml
          subPath: otel-config.yml
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - /bin/grpc_health_probe
            - -addr=:3550
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        securityContext:
          readOnlyRootFilesystem: true
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
          && until nc -z -w2 flagd 8013; do echo "waiting for flagd:8013"; sleep 2; done && until nc -z
          -w2 astronomy-db 5432; do echo "waiting for astronomy-db:5432"; sleep 2; done
      volumes:
      - name: otel-config
        configMap:
          name: product-catalog-otel-config
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: product-catalog
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-catalog
  ports:
  - name: grpc
    port: 3550
    targetPort: 3550
