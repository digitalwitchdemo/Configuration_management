apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: currency
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: currency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: currency
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: currency
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/currency:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 20M
          requests:
            memory: 20M
        ports:
        - containerPort: 7001
          protocol: TCP
        env:
        - name: CURRENCY_PORT
          value: '7001'
        - name: VERSION
          value: 3.0.0
        - name: OTEL_SERVICE_NAME
          value: currency
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=high
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          exec:
            command:
            - nc
            - -z
            - localhost
            - '7001'
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: currency
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: currency
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: currency
  ports:
  - name: grpc
    port: 7001
    targetPort: 7001
