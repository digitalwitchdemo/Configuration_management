apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: chatbot
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chatbot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatbot
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: chatbot
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/chatbot:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 500M
          requests:
            memory: 500M
        ports:
        - containerPort: 7860
          protocol: TCP
        env:
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
          value: 'true'
        - name: OPAMP_SERVER_ENDPOINT
          value: https://$(OPAMP_SERVER_HOST):4320/v1/opamp
        - name: OPAMP_SERVER_TLS_INSECURE_SKIP_VERIFY
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: chatbot
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=low
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          tcpSocket:
            port: 7860
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 agent 8010; do echo "waiting for agent:8010"; sleep 2; done && until nc -z -w2
          opamp-server 4320; do echo "waiting for opamp-server:4320"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: chatbot
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chatbot
  ports:
  - name: http
    port: 7860
    targetPort: 7860
