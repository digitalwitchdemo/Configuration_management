apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: agent
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/agent:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 500M
          requests:
            memory: 500M
        ports:
        - containerPort: 8010
          protocol: TCP
        env:
        - name: OTEL_EXPORTER_OTLP_INSECURE
          value: 'true'
        - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
          value: 'true'
        - name: OPENAI_API_KEY
          value: $(API_KEY)
        - name: OTEL_SERVICE_NAME
          value: agent
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=low
        envFrom:
        - configMapRef:
            name: common-config
        - secretRef:
            name: llm-secret
        volumeMounts:
        - name: fixtures
          mountPath: /app/fixtures/vcr_cassettes
        readinessProbe:
          tcpSocket:
            port: 8010
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
          && until nc -z -w2 product-catalog 3550; do echo "waiting for product-catalog:3550"; sleep 2;
          done && until nc -z -w2 mcp 8011; do echo "waiting for mcp:8011"; sleep 2; done
      volumes:
      - name: fixtures
        configMap:
          name: agent-fixtures
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent
  ports:
  - name: http
    port: 8010
    targetPort: 8010
