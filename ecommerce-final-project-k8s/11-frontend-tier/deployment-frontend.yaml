apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: frontend
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/frontend:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 250M
          requests:
            memory: 250M
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: '8080'
        - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://localhost:8080/otlp-http/v1/traces
        - name: WEB_OTEL_SERVICE_NAME
          value: frontend-web
        - name: OTEL_SERVICE_NAME
          value: frontend
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=critical
        envFrom:
        - configMapRef:
            name: common-config
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 ad 9555; do echo "waiting for ad:9555"; sleep 2; done && until nc -z -w2 cart
          7070; do echo "waiting for cart:7070"; sleep 2; done && until nc -z -w2 checkout 5050; do echo
          "waiting for checkout:5050"; sleep 2; done && until nc -z -w2 currency 7001; do echo "waiting
          for currency:7001"; sleep 2; done && until nc -z -w2 product-catalog 3550; do echo "waiting
          for product-catalog:3550"; sleep 2; done && until nc -z -w2 quote 8090; do echo "waiting for
          quote:8090"; sleep 2; done && until nc -z -w2 recommendation 9001; do echo "waiting for recommendation:9001";
          sleep 2; done && until nc -z -w2 shipping 50050; do echo "waiting for shipping:50050"; sleep
          2; done && until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep
          2; done && until nc -z -w2 image-provider 8081; do echo "waiting for image-provider:8081"; sleep
          2; done && until nc -z -w2 flagd 8013; do echo "waiting for flagd:8013"; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
  - name: http
    port: 8080
    targetPort: 8080
