# OPTIONAL / NOT applied by deploy.sh by default.
#
# The rest of this manifest set uses dynamic provisioning: a PVC referencing
# the otel-demo-gp3 StorageClass causes Kubernetes+the EBS CSI driver to create
# the PersistentVolume automatically. That's the recommended path on EKS.
#
# This file shows the alternative - STATIC provisioning - for cases where you
# want Postgres bound to a specific, pre-existing EBS volume (e.g. one restored
# from a snapshot) instead of a fresh empty one. Fill in a real volumeHandle
# (the EBS volume ID) below, then apply this instead of letting the PVC in
# 03-pvc/pvc-postgres.yaml provision dynamically. To use it:
#   1. kubectl apply -f 01-storage/pv-postgres-static-example.yaml
#   2. Edit 03-pvc/pvc-postgres.yaml: set storageClassName: "" and add
#      volumeName: postgres-data-static so the PVC binds to this PV instead of
#      dynamically provisioning a new one.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data-static
  labels:
    app.kubernetes.io/name: astronomy-db
    app.kubernetes.io/part-of: otel-demo
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ''
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-REPLACE_WITH_REAL_EBS_VOLUME_ID
