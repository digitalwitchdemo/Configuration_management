apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: flagd
        image: ghcr.io/open-feature/flagd:v0.16.0
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 75M
          requests:
            memory: 75M
        ports:
        - containerPort: 8013
          protocol: TCP
        - containerPort: 8016
          protocol: TCP
        command:
        - start
        - --uri
        - file:./etc/flagd/demo.flagd.json
        env:
        - name: GOMEMLIMIT
          value: 60MiB
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_SERVICE_NAME
          value: flagd
        envFrom:
        - configMapRef:
            name: common-config
        volumeMounts:
        - name: config
          mountPath: /etc/flagd
        readinessProbe:
          tcpSocket:
            port: 8013
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
      volumes:
      - name: config
        configMap:
          name: flagd-config
---
apiVersion: v1
kind: Service
metadata:
  name: flagd
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: flagd
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flagd
  ports:
  - name: rpc
    port: 8013
    targetPort: 8013
  - name: ofrep
    port: 8016
    targetPort: 8016
