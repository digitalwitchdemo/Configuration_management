apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagd-ui
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: flagd-ui
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flagd-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagd-ui
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: flagd-ui
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/flagd-ui:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 200M
          requests:
            memory: 200M
        ports:
        - containerPort: 4000
          protocol: TCP
        env:
        - name: OTEL_SERVICE_NAME
          value: flagd-ui
        - name: PHX_HOST
          value: localhost
        envFrom:
        - configMapRef:
            name: common-config
        - secretRef:
            name: flagd-ui-secret
        volumeMounts:
        - name: config
          mountPath: /app/data
        readinessProbe:
          tcpSocket:
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 otel-collector 4317; do echo "waiting for otel-collector:4317"; sleep 2; done
          && until nc -z -w2 flagd 8013; do echo "waiting for flagd:8013"; sleep 2; done
      volumes:
      - name: config
        configMap:
          name: flagd-config
---
apiVersion: v1
kind: Service
metadata:
  name: flagd-ui
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: flagd-ui
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flagd-ui
  ports:
  - name: http
    port: 4000
    targetPort: 4000
