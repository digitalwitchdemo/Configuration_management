apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensearch
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: opensearch
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/opensearch:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 1G
          requests:
            memory: 1G
        ports:
        - containerPort: 9200
          protocol: TCP
        env:
        - name: cluster.name
          value: demo-cluster
        - name: node.name
          value: demo-node
        - name: bootstrap.memory_lock
          value: 'false'
        - name: discovery.type
          value: single-node
        - name: OPENSEARCH_JAVA_OPTS
          value: -Xms400m -Xmx400m
        - name: DISABLE_INSTALL_DEMO_CONFIG
          value: 'true'
        - name: DISABLE_SECURITY_PLUGIN
          value: 'true'
        volumeMounts:
        - name: data
          mountPath: /usr/share/opensearch/data
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - curl -s http://localhost:9200/_cluster/health | grep -E '"status":"(green|yellow)"'
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: opensearch-data
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: opensearch
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opensearch
  ports:
  - name: http
    port: 9200
    targetPort: 9200
