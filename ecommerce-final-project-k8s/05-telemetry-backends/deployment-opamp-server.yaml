apiVersion: apps/v1
kind: Deployment
metadata:
  name: opamp-server
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: opamp-server
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opamp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opamp-server
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: opamp-server
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/opamp-server:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 65M
          requests:
            memory: 65M
        ports:
        - containerPort: 4320
          protocol: TCP
        - containerPort: 4321
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: 4321
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: opamp-server
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: opamp-server
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opamp-server
  ports:
  - name: opamp
    port: 4320
    targetPort: 4320
  - name: ui
    port: 4321
    targetPort: 4321
