apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: otel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: otel-demo
    spec:
      containers:
      - name: checkout
        image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/ecomerce/checkout:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 20M
          requests:
            memory: 20M
        ports:
        - containerPort: 5050
          protocol: TCP
        env:
        - name: CHECKOUT_PORT
          value: '5050'
        - name: GOMEMLIMIT
          value: 16MiB
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf
        - name: OTEL_GO_X_OBSERVABILITY
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: checkout
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.namespace=$(OTEL_SERVICE_NAMESPACE),service.version=$(IMAGE_VERSION),service.criticality=critical
        envFrom:
        - configMapRef:
            name: common-config
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        readinessProbe:
          exec:
            command:
            - /bin/grpc_health_probe
            - -addr=:5050
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        securityContext:
          readOnlyRootFilesystem: true
      initContainers:
      - name: wait-for-deps
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z -w2 cart 7070; do echo "waiting for cart:7070"; sleep 2; done && until nc -z -w2
          currency 7001; do echo "waiting for currency:7001"; sleep 2; done && until nc -z -w2 email 6060;
          do echo "waiting for email:6060"; sleep 2; done && until nc -z -w2 payment 50051; do echo "waiting
          for payment:50051"; sleep 2; done && until nc -z -w2 product-catalog 3550; do echo "waiting
          for product-catalog:3550"; sleep 2; done && until nc -z -w2 shipping 50050; do echo "waiting
          for shipping:50050"; sleep 2; done && until nc -z -w2 otel-collector 4317; do echo "waiting
          for otel-collector:4317"; sleep 2; done && until nc -z -w2 flagd 8013; do echo "waiting for
          flagd:8013"; sleep 2; done && until nc -z -w2 kafka 9092; do echo "waiting for kafka:9092";
          sleep 2; done
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: otel-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: checkout
  ports:
  - name: grpc
    port: 5050
    targetPort: 5050
