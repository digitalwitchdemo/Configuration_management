# These match the plaintext defaults already baked into src/postgresql/init.sql
# and .env in this repo (this is a public demo app, not a real credential store).
# Change them - and update init.sql to match - before using this anywhere real.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: postgres-secret
    app.kubernetes.io/part-of: otel-demo
type: Opaque
stringData:
  POSTGRES_PASSWORD: changeit
  POSTGRES_ASTRONOMY_PASSWORD: astronomy_password
  POSTGRES_MONITORING_PASSWORD: monitoring_password
