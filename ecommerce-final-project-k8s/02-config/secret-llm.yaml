# Fill in a real LLM provider key for the agent/chatbot stack to call a live
# model. Left blank, USE_VCR=True (see common-config) makes the agent replay
# the recorded fixtures in agent-fixtures instead of calling out.
# kubectl create secret generic llm-secret -n otel-demo \
#   --from-literal=API_KEY='sk-...' --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: llm-secret
  namespace: otel-demo
  labels:
    app.kubernetes.io/name: llm-secret
    app.kubernetes.io/part-of: otel-demo
type: Opaque
stringData:
  API_KEY: ''
